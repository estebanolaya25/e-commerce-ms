<header class="encabezado">
  <div>
    <h1>Catálogo</h1>
    <span class="texto-suave">{{ marcas.length }} marcas</span>
  </div>
  <button class="btn btn-primary" type="button" (click)="nueva()"><i class="bi bi-plus-lg me-1"></i>Nueva marca</button>
</header>

<app-pestanas-catalogo activa="marcas"></app-pestanas-catalogo>

<div class="alert alert-danger" *ngIf="error">{{ error }}</div>

<div class="distribucion" [class.con-formulario]="mostrarFormulario">
  <div>
    <div class="buscar superficie">
      <i class="bi bi-search"></i>
      <input class="form-control" [(ngModel)]="filtro" placeholder="Filtrar marcas" aria-label="Filtrar marcas">
    </div>
    <div class="superficie tabla">
      <table class="table align-middle mb-0">
        <thead>
          <tr><th>Marca</th><th>Slug</th><th class="text-center">Activa</th><th></th></tr>
        </thead>
        <tbody>
          <ng-container *ngIf="cargando">
            <tr *ngFor="let i of [1, 2, 3, 4, 5]"><td colspan="4"><div class="esqueleto"></div></td></tr>
          </ng-container>
          <ng-container *ngIf="!cargando">
            <tr *ngFor="let m of visibles" class="fila" [class.apagada]="!m.activa" [class.seleccionada]="editando?.id === m.id">
              <td class="nombre">{{ m.nombre }}</td>
              <td class="texto-suave">{{ m.slug }}</td>
              <td class="text-center">
                <div class="form-check form-switch d-inline-block m-0">
                  <input class="form-check-input" type="checkbox" role="switch" [checked]="m.activa" [disabled]="cambiando.has(m.id)"
                         (change)="cambiarEstado(m, $event)" [attr.aria-label]="'Activa: ' + m.nombre">
                </div>
              </td>
              <td class="text-end"><button class="btn btn-sm btn-outline-primary" type="button" (click)="editar(m)">Editar</button></td>
            </tr>
            <tr *ngIf="visibles.length === 0"><td colspan="4" class="vacio">No hay marcas que coincidan.</td></tr>
          </ng-container>
        </tbody>
      </table>
    </div>
  </div>

  <form class="superficie formulario" *ngIf="mostrarFormulario" [formGroup]="formulario" (ngSubmit)="guardar()" novalidate>
    <h2>{{ editando ? 'Editar marca' : 'Nueva marca' }}</h2>
    <div class="mb-3">
      <label class="form-label" for="marcaNombre">Nombre</label>
      <input id="marcaNombre" class="form-control" formControlName="nombre" maxlength="100" [class.is-invalid]="invalido('nombre')">
      <div class="invalid-feedback">Escriba el nombre.</div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="marcaSlug">Slug <span class="texto-suave">(opcional)</span></label>
      <input id="marcaSlug" class="form-control" formControlName="slug" maxlength="120" [class.is-invalid]="invalido('slug')">
      <div class="invalid-feedback">Solo minúsculas, números y guiones.</div>
    </div>
    <div class="acciones">
      <button class="btn btn-link" type="button" (click)="cancelar()">Cancelar</button>
      <button class="btn btn-primary" type="submit" [disabled]="guardando">
        <span class="spinner-border spinner-border-sm me-2" *ngIf="guardando"></span>{{ editando ? 'Guardar' : 'Crear' }}
      </button>
    </div>
  </form>
</div>
