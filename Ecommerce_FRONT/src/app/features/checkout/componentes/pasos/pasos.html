<ol class="pasos">
  <li *ngFor="let paso of pasos; let i = index" [class.hecho]="i < actual" [class.actual]="i === actual">
    <span class="numero">
      <i class="bi bi-check-lg" *ngIf="i < actual; else numero"></i>
      <ng-template #numero>{{ i + 1 }}</ng-template>
    </span>
    <span class="nombre">{{ paso }}</span>
  </li>
</ol>
